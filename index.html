<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MTK - Manajemen Delegasi</title>
    <meta name="description" content="Sistem Informasi & Manajemen Delegasi MTK, Anggaran, dan Pencatatan Real-time." />
    
    <!-- OpenGraph & Social Metadata -->
    <meta property="og:title" content="MTK - Manajemen Delegasi" />
    <meta property="og:description" content="Sistem Informasi & Manajemen Delegasi MTK, Anggaran, dan Pencatatan Real-time." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />

    <!-- Cache-Control Meta Tags: Mencegah HP menyimpan versi HTML basi -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Android / Chrome Native App Settings -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="application-name" content="Delegasi MTK" />

    <!-- iOS / Apple Safari Native App Settings (Menghilangkan Safari Bar & Status Bar Transparan) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Delegasi MTK" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Apple Touch Icons & Favicons -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- Windows / Edge Tiles -->
    <meta name="msapplication-TileColor" content="#1e40af" />
    <meta name="msapplication-TileImage" content="/icon-512.png" />
    <meta name="msapplication-navbutton-color" content="#1e40af" />
  </head>
  <body class="bg-slate-50 antialiased select-none overscroll-none">
    <div id="root">
      <!-- Loading Splash Anti-Blank: Akan otomatis digantikan saat React selesai di-mount -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; text-align: center;">
        <div style="width: 44px; height: 44px; border: 4px solid #e2e8f0; border-top-color: #1e40af; border-radius: 50%; animation: mtkSpin 0.8s linear infinite; margin-bottom: 16px;"></div>
        <div style="font-weight: 700; color: #1e3a8a; font-size: 16px; letter-spacing: -0.01em;">MTK - Manajemen Delegasi</div>
        <div style="font-size: 12px; color: #64748b; margin-top: 6px;">Memuat sistem & menyinkronkan data...</div>
      </div>
      <style>
        @keyframes mtkSpin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </div>
    
    <!-- Compatibility Guard untuk HP Lama & WebView Tanpa Chrome -->
    <script>
      // Fallback globalThis untuk WebView Android lama
      if (typeof globalThis === 'undefined') {
        window.globalThis = window;
      }
      // Deteksi jika localStorage diblokir oleh sistem webview HP
      try {
        var testKey = '__test_ls__';
        window.localStorage.setItem(testKey, testKey);
        window.localStorage.removeItem(testKey);
      } catch (e) {
        console.warn('Storage fallback enabled (WebView strict sandbox)');
        var memStorage = {};
        window.localStorage = {
          getItem: function(k) { return memStorage[k] || null; },
          setItem: function(k, v) { memStorage[k] = String(v); },
          removeItem: function(k) { delete memStorage[k]; },
          clear: function() { memStorage = {}; }
        };
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
    
    <!-- PWA Service Worker Registration & Auto-Update Engine -->
    <script>
      (function() {
        if (!('serviceWorker' in navigator)) return;

        var refreshing = false;
        // Tangani saat service worker versi baru mengambil alih kendali
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (refreshing) return;
          refreshing = true;
          console.log('[Auto-Update] Controller changed. Memperbarui aplikasi ke versi terbaru...');
          // Muat ulang dengan bersih agar aset terbaru langsung dipakai
          window.location.reload();
        });

        // Dengarkan pesan dari sw.js
        navigator.serviceWorker.addEventListener('message', function(event) {
          if (event.data && event.data.type === 'SW_VERSION_ACTIVATED') {
            console.log('[Auto-Update] Versi Service Worker baru aktif:', event.data.cacheName);
            window.dispatchEvent(new CustomEvent('mtk:app-updated', { detail: event.data }));
          }
        });

        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(registration) {
              console.log('PWA: ServiceWorker aktif di scope:', registration.scope);

              // 1. Cek pembaruan berkala saat ada service worker baru menunggu
              if (registration.waiting) {
                registration.waiting.postMessage({ type: 'SKIP_WAITING' });
              }

              registration.addEventListener('updatefound', function() {
                var newWorker = registration.installing;
                if (!newWorker) return;
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[Auto-Update] Versi baru ditemukan & terpasang. Mengaktifkan...');
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              });

              // 2. Cek pembaruan setiap kali pengguna membuka atau kembali ke aplikasi di HP
              document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible' && navigator.onLine) {
                  registration.update().catch(function(err) {
                    console.warn('[Auto-Update] Cek pembaruan via visibility:', err);
                  });
                }
              });

              // 3. Cek pembaruan otomatis berkala setiap 60 detik saat online
              setInterval(function() {
                if (navigator.onLine) {
                  registration.update().catch(function() {});
                }
              }, 60000);

              // Helper global untuk cek pembaruan manual dari tombol aplikasi
              window.__checkMTKAppUpdate = function() {
                return registration.update().then(function() {
                  return true;
                }).catch(function() {
                  return false;
                });
              };
            })
            .catch(function(err) {
              console.warn('PWA: Gagal mendaftarkan ServiceWorker:', err);
            });
        });

        // Helper global untuk force clear cache & reload
        window.__forceMTKAppReload = function() {
          if ('caches' in window) {
            caches.keys().then(function(names) {
              return Promise.all(names.map(function(name) {
                return caches.delete(name);
              }));
            }).then(function() {
              window.location.reload();
            });
          } else {
            window.location.reload();
          }
        };
      })();
    </script>
    <noscript>
      <div style="padding: 24px; text-align: center; font-family: sans-serif; background: #ffffff; color: #1e293b;">
        <h2 style="font-size: 18px; font-weight: bold; color: #1e40af;">Aplikasi Membutuhkan JavaScript</h2>
        <p style="font-size: 14px; margin-top: 8px; color: #64748b;">
          Silakan aktifkan JavaScript atau pastikan WebView di perangkat Anda aktif untuk membuka aplikasi ini.
        </p>
      </div>
    </noscript>
  </body>
</html>
