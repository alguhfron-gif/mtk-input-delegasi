<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background with subtle modern squircle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle decorative geometric background rings -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="155" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" />

  <!-- Outer Emblem Shield / Badge -->
  <g filter="url(#shadow)">
    <path d="M256 90 L380 148 C380 260 256 365 256 365 C256 365 132 260 132 148 Z" 
          fill="rgba(15, 23, 42, 0.65)" 
          stroke="url(#cyanGrad)" 
          stroke-width="4" 
          stroke-linejoin="round" />
  </g>

  <!-- Sigma (Σ) Math Symbol with Gold Gradient -->
  <path d="M332 170 L200 170 L260 236 L200 302 L332 302 L322 280 L238 280 L278 236 L238 192 L322 192 Z" 
        fill="url(#goldGrad)" 
        filter="url(#glow)" />

  <!-- Math Operation Accent Icons (Plus, Minus, Multiply, Divide dots) -->
  <g fill="#93c5fd" opacity="0.85">
    <!-- Plus top right -->
    <rect x="310" y="125" width="16" height="4" rx="2" />
    <rect x="316" y="119" width="4" height="16" rx="2" />
    
    <!-- Multiplication / Star top left -->
    <circle cx="185" cy="130" r="4" fill="#67e8f9" />
    
    <!-- Percent/Finance dots -->
    <circle cx="318" cy="330" r="5" fill="#fde047" />
    <circle cx="194" cy="330" r="5" fill="#fde047" />
  </g>

  <!-- Bottom Ribbon / Text Plate -->
  <g filter="url(#shadow)">
    <rect x="116" y="382" width="280" height="48" rx="24" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2.5" />
    <text x="256" y="414" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="22" 
          font-weight="800" 
          letter-spacing="4" 
          fill="#ffffff" 
          text-anchor="middle">DELEGASI MTK</text>
  </g>
</svg>